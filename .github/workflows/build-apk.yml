name: Build APK

# Free cloud builds of the Kolab APK — no Android Studio needed.
# Trigger: push to main/master, manual run (Actions tab -> Run workflow).
# Result: an APK artifact you can download and sideload onto a phone.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          Backend base URL baked into the APK (e.g.
          https://kolab-api-7r6i.onrender.com/api/ for the hosted API,
          http://192.168.1.10:3000/api/ for a phone on the same Wi-Fi,
          or http://10.0.2.2:3000/api/ for the emulator).
        required: true
        default: "https://kolab-api-7r6i.onrender.com/api/"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest image already ships the Android SDK. The previous
      # android-actions/setup-android@v3 step broke because it runs
      # `sdkmanager tools`, a package removed in cmdline-tools 16.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -n1)"
          if [ -z "$SDKM" ]; then
            echo "No sdkmanager found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Allow cleartext HTTP to the selected backend host
        run: |
          python3 - "${{ inputs.base_url }}" <<'EOF'
          import sys
          from urllib.parse import urlsplit

          raw = sys.argv[1]
          host = urlsplit(raw).hostname if raw else None
          if not host:
              print("no custom host; leaving network security config untouched")
              raise SystemExit(0)

          domains = {"10.0.2.2", "localhost", "127.0.0.1", host}
          lines = [
              f'        <domain includeSubdomains="false">{d}</domain>'
              for d in sorted(domains)
          ]
          xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '    <base-config cleartextTrafficPermitted="false" />\n'
              '    <domain-config cleartextTrafficPermitted="true">\n'
              + "\n".join(lines)
              + '\n'
              '    </domain-config>\n'
              '</network-security-config>\n'
          )
          path = "app/src/main/res/xml/network_security_config.xml"
          with open(path, "w") as f:
              f.write(xml)
          print("network_security_config.xml updated for host:", host)
          EOF

      - name: Build debug APK
        env:
          # `inputs.base_url` is empty on push events; fall back to production
          # so the uploaded APK is usable on a real phone.
          KOLAB_BASE_URL: ${{ inputs.base_url || 'https://kolab-api-7r6i.onrender.com/api/' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run JVM tests (best effort; the app still ships if these flake)
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kolab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error