name: Build APK

# Free cloud builds of the Kolab APK — no Android Studio needed.
# Trigger: push to main/master, manual run (Actions tab -> Run workflow).
# Result: an APK artifact you can download and sideload onto a phone.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (accepts licenses, installs cmdline-tools)
        uses: android-actions/setup-android@v3

      - name: Ensure required SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run JVM tests (best effort; the app still ships if these flake)
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kolab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error